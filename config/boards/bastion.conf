#
# Steadfast-Digital Bastion OS
# Target: Raspberry Pi 5 Media Appliance
#
BOARD_NAME="Bastion RPi5"
BOARDFAMILY="rpi-5-b"
BOARD_MAINTAINER="Steadfast-Digital"
BOARD_VENDOR="Raspberry Pi"

# System Configuration
BUILD_MINIMAL="yes"
BUILD_DESKTOP="no"
KERNEL_ONLY="no"
KERNEL_CONFIGURE="no"
COMPRESSION="xz"

# Default User Account
# Passwords should be changed by the end-user on first boot or secured via other means.
ROOT_PASS="bastion"
FIRST_USER_NAME="bastion"
FIRST_USER_PASS="bastion"

# Essential Networking and Hardware Support
INSTALL_WIFI_DRIVERS="yes"
INSTALL_BLUETOOTH="yes"

# Base packages for our media appliance.
# We install 'kodi' here; other dependencies will be handled by our custom scripts.
EXTRA_INSTALL_PACKAGES="kodi lirc libnfs13 nfs-common parted curl gawk"
