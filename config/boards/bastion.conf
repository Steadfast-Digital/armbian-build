#
# Steadfast-Digital Bastion OS
# Target: Raspberry Pi 5 Media Appliance
#
BOARD_NAME="Bastion RPi5"
BOARD_MAINTAINER="Steadfast-Digital"
BOARD_VENDOR="Raspberry Pi"

# INHERITANCE: This is the critical line.
# It tells the build system to use the kernel, bootloader, and patch
# configurations from the official 'raspberrypi5' board.
BOOTCONFIG="raspberrypi5"

# EXPLICIT DEFINITION: This is the direct fix for our error.
# We are manually setting the board family to prevent it from being empty.
BOARDFAMILY="rpi"

# System Configuration
BUILD_MINIMAL="yes"
BUILD_DESKTOP="no"
KERNEL_ONLY="no"
KERNEL_CONFIGURE="no"
COMPRESSION="xz"

# Default User Account
ROOT_PASS="bastion"
FIRST_USER_NAME="bastion"
FIRST_USER_PASS="bastion"
