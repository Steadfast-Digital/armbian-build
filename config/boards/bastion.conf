# build/config/boards/bastion.conf

# first, pull in *all* of the defaults from rpi4b.conf
source "$(dirname "$0")/rpi4b.conf"

###############################################################################
#
# Bastion RPi5 – minimal, NVMe-booted Kodi 21 appliance
#
# These are the *only* values we override; everything else is left as in
# rpi4b.conf (kernel, U-Boot, firmware, bootloader, generic overlays, etc.).
#
###############################################################################

# User-visible name
BOARD_NAME="Bastion RPi5"

# Underlying BCM family (still bcm2711)
BOARDFAMILY="bcm2711"

# Build a minimal, CLI-only image (no desktop packages),
# but still include full user-land for services like Kodi
BUILD_MINIMAL=yes
KERNEL_ONLY=no

# Install LIRC so we can map IR remotes (Kodi itself is pinned from Sid)
EXTRA_INSTALL_PACKAGES="lirc"

# Strip out all of X11/desktop to save space & boot time
REMOVE_PACKAGES="xserver-xorg* x11-common"
